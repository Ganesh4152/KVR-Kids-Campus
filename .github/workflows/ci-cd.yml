name: KVR Kids Campus CI/CD

on:
  push:
    branches:
      - feature/github-actions-cicd

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kvr-kids-campus-deployment
  cancel-in-progress: false

env:
  BACKEND_IMAGE: gani4152/kvr-kids-campus-backend
  FRONTEND_IMAGE: gani4152/kvr-kids-campus-frontend

jobs:

  # ==========================================
  # JOB 1: APPLICATION BUILD AND TEST
  # ==========================================

  build-and-test:

    name: Build and Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Backend
        run: |
          chmod +x backend/mvnw
          cd backend
          ./mvnw -B -ntp clean package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # ==========================================
  # JOB 2: DOCKER IMAGE BUILD AND PUSH
  # ==========================================

  docker-build-push:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    needs: build-and-test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================
  # JOB 3: AUTOMATED EC2 DEPLOYMENT
  # ==========================================

  deploy-to-ec2:

    name: Deploy Application to AWS EC2

    runs-on: ubuntu-latest

    needs: docker-build-push

    env:
      BACKEND_IMAGE_TAG: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      FRONTEND_IMAGE_TAG: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

    steps:

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "KVR_BACKEND_IMAGE='$BACKEND_IMAGE_TAG' KVR_FRONTEND_IMAGE='$FRONTEND_IMAGE_TAG' bash -s" <<'REMOTE'

          set -Eeuo pipefail

          cd /home/ubuntu/DevOpsProjects/KVR-Kids-Campus

          echo "Starting KVR Kids Campus deployment"

          if [ ! -f .env ]; then
            echo "ERROR: EC2 .env file is missing"
            exit 1
          fi

          docker compose --env-file .env config -q

          # Save the currently running images for rollback.

          OLD_BACKEND_ID=$(docker inspect --format '{{.Image}}' kvr-backend)

          OLD_FRONTEND_ID=$(docker inspect --format '{{.Image}}' kvr-frontend)

          ROLLBACK_TAG="rollback-$(date +%s)"

          OLD_BACKEND_IMAGE="kvr-local/backend:$ROLLBACK_TAG"

          OLD_FRONTEND_IMAGE="kvr-local/frontend:$ROLLBACK_TAG"

          docker tag "$OLD_BACKEND_ID" "$OLD_BACKEND_IMAGE"

          docker tag "$OLD_FRONTEND_ID" "$OLD_FRONTEND_IMAGE"

          # Rollback function.

          rollback() {

            STATUS=$?

            trap - ERR

            echo "Deployment failed. Starting rollback."

            export KVR_BACKEND_IMAGE="$OLD_BACKEND_IMAGE"

            export KVR_FRONTEND_IMAGE="$OLD_FRONTEND_IMAGE"

            docker compose --env-file .env up -d --no-deps backend frontend || true

            sleep 15

            curl -fsS http://localhost/ >/dev/null || true

            echo "Rollback process completed."

            exit "$STATUS"
          }

          trap rollback ERR

          # Pull newly published images.

          export KVR_BACKEND_IMAGE
          export KVR_FRONTEND_IMAGE

          docker compose --env-file .env pull backend frontend

          # Update only application containers.
          # MySQL is not recreated or removed.

          docker compose --env-file .env up -d --no-deps backend frontend

          # Application health checks.

          HEALTHY=0

          for attempt in $(seq 1 30); do

            if curl -fsS http://localhost/ >/dev/null && \
               curl -fsS http://localhost/api/students >/dev/null; then

              HEALTHY=1

              echo "Application health checks passed."

              break

            fi

            echo "Waiting for application... attempt $attempt"

            sleep 5

          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Application health checks failed."
            false
          fi

          trap - ERR

          echo "Deployment successful."

          docker compose --env-file .env ps

          REMOTE
