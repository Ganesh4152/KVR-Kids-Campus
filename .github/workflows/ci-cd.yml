name: KVR Kids Campus CI/CD

on:
  push:
    branches:
      - feature/github-actions-cicd

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kvr-kids-campus-deployment
  cancel-in-progress: false

env:
  BACKEND_IMAGE: gani4152/kvr-kids-campus-backend
  FRONTEND_IMAGE: gani4152/kvr-kids-campus-frontend

jobs:

  # ==========================================
  # JOB 1: APPLICATION BUILD AND TEST
  # ==========================================

  build-and-test:

    name: Build and Test Application
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: kvr_school

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/kvr_school?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-root-password

    steps:

      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Backend
        run: |
          chmod +x backend/mvnw
          cd backend
          ./mvnw -B -ntp clean package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # ==========================================
  # JOB 2: DOCKER IMAGE BUILD AND PUSH
  # ==========================================

  docker-build-push:

    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: build-and-test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================
  # JOB 3: AUTOMATED EC2 DEPLOYMENT
  # ==========================================

  deploy-to-ec2:

    name: Deploy Application to AWS EC2
    runs-on: ubuntu-latest

    needs: docker-build-push

    steps:

      # --------------------------------------
      # CONFIGURE SSH
      # --------------------------------------

      - name: Configure SSH

        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      # --------------------------------------
      # DEPLOY APPLICATION TO EC2
      # --------------------------------------

      - name: Deploy Application

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

          BACKEND_IMAGE_TAG: gani4152/kvr-kids-campus-backend:${{ github.sha }}

          FRONTEND_IMAGE_TAG: gani4152/kvr-kids-campus-frontend:${{ github.sha }}

        run: |

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "KVR_BACKEND_IMAGE='$BACKEND_IMAGE_TAG' KVR_FRONTEND_IMAGE='$FRONTEND_IMAGE_TAG' bash -s" <<'REMOTE'

          set -Eeuo pipefail

          cd /home/ubuntu/DevOpsProjects/KVR-Kids-Campus

          echo "======================================"
          echo "KVR Kids Campus Deployment Started"
          echo "======================================"

          # ----------------------------------
          # CHECK ENVIRONMENT CONFIGURATION
          # ----------------------------------

          if [ ! -f .env ]; then
            echo "ERROR: EC2 .env file is missing"
            exit 1
          fi

          docker compose --env-file .env config -q


          # ----------------------------------
          # PRE-DEPLOYMENT MYSQL HEALTH CHECK
          # ----------------------------------

          MYSQL_STATUS=$(docker inspect \
            --format '{{.State.Health.Status}}' kvr-mysql)

          if [ "$MYSQL_STATUS" != "healthy" ]; then

            echo "ERROR: MySQL is not healthy. Deployment cancelled."

            exit 1

          fi

          echo "Pre-deployment MySQL health check passed."


          # ----------------------------------
          # SAVE PREVIOUS APPLICATION IMAGES
          # ----------------------------------

          OLD_BACKEND_ID=$(docker inspect --format '{{.Image}}' kvr-backend)

          OLD_FRONTEND_ID=$(docker inspect --format '{{.Image}}' kvr-frontend)

          ROLLBACK_TAG="rollback-$(date +%s)"

          OLD_BACKEND_IMAGE="kvr-local/backend:$ROLLBACK_TAG"

          OLD_FRONTEND_IMAGE="kvr-local/frontend:$ROLLBACK_TAG"

          docker tag "$OLD_BACKEND_ID" "$OLD_BACKEND_IMAGE"

          docker tag "$OLD_FRONTEND_ID" "$OLD_FRONTEND_IMAGE"

          echo "Previous application images saved."


          # ----------------------------------
          # ROLLBACK FUNCTION
          # ----------------------------------

          rollback() {

            STATUS=$?

            trap - ERR

            echo "======================================"
            echo "DEPLOYMENT FAILED"
            echo "Starting rollback"
            echo "======================================"

            export KVR_BACKEND_IMAGE="$OLD_BACKEND_IMAGE"

            export KVR_FRONTEND_IMAGE="$OLD_FRONTEND_IMAGE"

            docker compose --env-file .env up \
              -d --no-build --no-deps backend frontend || true

            echo "Waiting for rollback health checks..."

            ROLLBACK_HEALTHY=0

            for attempt in $(seq 1 30); do

              BACKEND_STATUS=$(docker inspect \
                --format '{{.State.Health.Status}}' kvr-backend 2>/dev/null || echo "missing")

              if [ "$BACKEND_STATUS" = "healthy" ] && \
                 curl -fsS http://localhost/ >/dev/null; then

                ROLLBACK_HEALTHY=1

                echo "Rollback health checks passed."

                break

              fi

              echo "Rollback attempt: $attempt"
              echo "Backend health: $BACKEND_STATUS"

              sleep 5

            done

            if [ "$ROLLBACK_HEALTHY" -ne 1 ]; then

              echo "WARNING: Rollback health checks failed."

              docker compose --env-file .env ps

              docker logs --tail 100 kvr-backend || true

            fi

            echo "Rollback process completed."

            exit "$STATUS"
          }

          trap rollback ERR


          # ----------------------------------
          # PULL NEW DOCKER IMAGES
          # ----------------------------------

          export KVR_BACKEND_IMAGE

          export KVR_FRONTEND_IMAGE

          echo "Pulling new Docker images..."

          docker compose --env-file .env pull backend frontend


          # ----------------------------------
          # DEPLOY NEW APPLICATION VERSIONS
          # ----------------------------------

          echo "Deploying backend and frontend..."

          docker compose --env-file .env up \
            -d --no-build --no-deps backend frontend


          # ----------------------------------
          # APPLICATION HEALTH CHECKS
          # ----------------------------------

          echo "Waiting for application health checks..."

          HEALTHY=0

          for attempt in $(seq 1 30); do

            BACKEND_STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' kvr-backend 2>/dev/null || echo "missing")

            if [ "$BACKEND_STATUS" = "healthy" ] && \
               curl -fsS http://localhost/ >/dev/null; then

              HEALTHY=1

              echo "Backend and frontend health checks passed."

              break

            fi

            echo "Waiting for application: attempt $attempt"

            echo "Backend health status: $BACKEND_STATUS"

            sleep 5

          done

          if [ "$HEALTHY" -ne 1 ]; then

            echo "Application health checks failed."

            docker compose --env-file .env ps

            docker logs --tail 100 kvr-backend || true

            false

          fi


          # ----------------------------------
          # VERIFY MYSQL HEALTH
          # ----------------------------------

          MYSQL_STATUS=$(docker inspect \
            --format '{{.State.Health.Status}}' kvr-mysql)

          if [ "$MYSQL_STATUS" != "healthy" ]; then

            echo "MySQL container is not healthy."

            false

          fi

          echo "MySQL health check passed."


          # ----------------------------------
          # DEPLOYMENT SUCCESSFUL
          # ----------------------------------

          trap - ERR

          echo "======================================"
          echo "KVR KIDS CAMPUS DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          docker compose --env-file .env ps

          REMOTE
