# =====================================================
# KVR Kids Campus - Spring Boot Configuration
# =====================================================

spring.application.name=kvr-school-backend

# =====================================================
# Server Configuration
# =====================================================

server.port=8080

# =====================================================
# MySQL Database Configuration
# =====================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/kvr_school?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =====================================================
# JPA / Hibernate
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# Logging
# =====================================================

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =====================================================
# File Upload
# =====================================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=20MB

# =====================================================
# JSON
# =====================================================

spring.jackson.serialization.indent-output=true

# =====================================================
# Time Zone
# =====================================================

spring.jackson.time-zone=Asia/Kolkata


# =====================================================
# TEMPORARY SPRING SECURITY DEBUG
# =====================================================

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
